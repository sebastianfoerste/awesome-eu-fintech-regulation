name: Link check

# Regulator sites rate-limit and bot-wall automated clients, so this runs on a
# schedule rather than on pull requests. A flaky merge gate would be worse than
# none. lychee.toml explains which status codes count as working and why EUR-Lex
# is excluded; scripts/verify_celex.py checks the EUR-Lex entries against CELLAR.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml README.md CONTRIBUTING.md docs/curation.md docs/level2.md
          fail: true

  celex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/verify_celex.py README.md
