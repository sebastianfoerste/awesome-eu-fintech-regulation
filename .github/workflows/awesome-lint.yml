name: Awesome lint

# The checks the main awesome list runs before accepting a list. awesome-lint
# reads the git history (the repo must be at least 30 days old), so check out
# the full history rather than the latest commit only.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  awesome-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          # No package.json here, so there is no lockfile for setup-node to cache.
          package-manager-cache: false
      - run: npx --yes awesome-lint@2.3.0 README.md
        env:
          github_token: ${{ github.token }}
