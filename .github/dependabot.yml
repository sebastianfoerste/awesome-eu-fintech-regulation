# Keeps the commit pins of the actions in .github/workflows/ current. A release
# is proposed once it is seven days old: minor and patch releases in one grouped
# pull request a week, each major release in its own. Security updates are not
# delayed. Delete this file to stop them.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 2
